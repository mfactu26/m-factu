name: M FactU CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify public and security files
        run: |
          test -f index.html
          test -f services.html
          test -f tarifs.html
          test -f contact.html
          test -f proposition.html
          test -f login.html
          test -f install.html
          test -f assets/app.js
          test -f assets/styles.css
          test -f assets/logo.svg
          test -f manifest.webmanifest
          test -f sw.js
          test -f api/secure.js
          test -f api/auth-login.js
          test -f api/logout.js
          test -f api/me.js
          test -f api/health.js
          test -f api/billing-create.js
          test -f api/stripe-webhook.js
          test -f api/report-daily.js
          test -f api/prospects-discover.js
          test -f api/prospect-contact.js
          test -f api/prospect-optout.js
          test -f api/orchestrator-run.js
          test -f lib/prospecting.cjs
          test -f lib/stripe.cjs
          test -f lib/email.cjs
          test -f lib/auth.cjs
          test -f lib/db.cjs
          test -f db/schema.sql

      - name: Ensure internal pages are not public files
        run: |
          test ! -f admin.html
          test ! -f orchestrateur.html
          test ! -f espace-client.html
          test ! -f dossier.html
          test ! -f onboarding.html

      - name: Check server JavaScript syntax
        run: |
          node --check api/secure.js
          node --check api/auth-login.js
          node --check api/logout.js
          node --check api/me.js
          node --check api/health.js
          node --check api/billing-create.js
          node --check api/stripe-webhook.js
          node --check api/report-daily.js
          node --check api/prospects-discover.js
          node --check api/prospect-contact.js
          node --check api/prospect-optout.js
          node --check api/orchestrator-run.js
          node -e "const s=require('fs').readFileSync('api/orchestrator-run.js','utf8'); if(!s.includes('nextPage')) throw new Error('rotating prospect cursor missing')"
          node --check lib/prospecting.cjs
          node --check lib/stripe.cjs
          node --check lib/email.cjs
          node --check lib/auth.cjs
          node --check lib/db.cjs
          node --check sw.js
          node -e "const s=require('fs').readFileSync('assets/app.js','utf8'); if(!s.includes('bindCardNavigation')) throw new Error('dashboard card navigation missing'); if((s.match(/bindCardNavigation\(\);/g)||[]).length<1) throw new Error('dashboard card navigation is not initialized'); if(!s.includes('data-href')) throw new Error('clickable row destinations missing')"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"

      - name: Test public contact enrichment helpers
        run: |
          node <<'NODE'
          const p=require('./lib/prospecting.cjs');
          const search='<a class="result__a" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Ftaxi-dupond.fr%2Fcontact&amp;rut=x">Taxi Dupond</a>';
          const links=p.extractSearchLinks(search);
          if(links[0]!=='https://taxi-dupond.fr/contact') throw new Error('DuckDuckGo link decoding failed');
          const emails=p.extractEmails('<a href="mailto:Contact@Taxi-Dupond.fr">Contact</a> contact@taxi-dupond.fr');
          if(emails.length!==1||emails[0]!=='contact@taxi-dupond.fr') throw new Error('email extraction failed');
          const phone=p.extractFrenchPhone('<p>06 12 34 56 78</p>');
          if(phone!=='0612345678') throw new Error('phone extraction failed');
          if(p.publicHttpUrl('http://127.0.0.1/admin')) throw new Error('private IPv4 must be blocked');
          if(p.publicHttpUrl('http://localhost/admin')) throw new Error('localhost must be blocked');
          const contacts=p.extractContactLinks('<a href="/contact">Contact</a><a href="https://other.test/contact">Other</a>','https://taxi-dupond.fr');
          if(contacts.length!==1||contacts[0]!=='https://taxi-dupond.fr/contact') throw new Error('contact-link filtering failed');
          console.log('Public enrichment helpers OK');
          NODE

      - name: Verify owner-only administration
        run: |
          node <<'NODE'
          const fs=require('fs');
          const secure=fs.readFileSync('api/secure.js','utf8');
          if(!/admin:\s*\["owner"\]/.test(secure)) throw new Error('admin must remain owner-only');
          if(!/orchestrateur:\s*\["owner"\]/.test(secure)) throw new Error('orchestrateur must remain owner-only');
          const files=['index.html','assets/logo.svg','api/secure.js'];
          for(const file of files){
            const text=fs.readFileSync(file,'utf8');
            if(text.includes('07 88 74 68 69')) throw new Error(file+' still contains the old phone number');
          }
          if(!fs.readFileSync('index.html','utf8').includes('07 87 08 51 31')) throw new Error('public phone number missing');
          console.log('Owner-only boundary and phone number OK');
          NODE

      - name: Check local HTML links
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const files=fs.readdirSync('.').filter(f=>f.endsWith('.html'));
          const missing=[];
          for(const file of files){
            const html=fs.readFileSync(file,'utf8');
            for(const m of html.matchAll(/(?:href|src)="([^"]+)"/g)){
              const href=m[1];
              if(/^(https?:|intent:|mailto:|tel:|#|data:|javascript:|\/)/.test(href)) continue;
              const clean=href.split('?')[0].split('#')[0];
              if(!clean) continue;
              if(!fs.existsSync(path.resolve(clean))) missing.push(file+' -> '+clean);
            }
          }
          if(missing.length){console.error(missing.join('\n'));process.exit(1)}
          console.log('Public local links OK');
          NODE
