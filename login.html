<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — M FactU</title><link rel="stylesheet" href="assets/styles.css"></head><body class="auth-page">
<main class="auth-wrap"><section class="auth-card"><a class="brand auth-brand" href="/"><img src="assets/logo.svg" alt="M FactU"><div><b>M FactU</b><small>Espace sécurisé</small></div></a><span class="eyebrow">CONNEXION</span><h1>Accéder à votre espace</h1><p class="auth-copy">Administration M FactU et espace client sont protégés par une session sécurisée.</p>
<form id="loginForm" class="auth-form"><div class="field"><label>Email</label><input name="email" type="email" autocomplete="username" required></div><div class="field"><label>Mot de passe</label><input name="password" type="password" autocomplete="current-password" required></div><button class="btn btn-blue" id="loginBtn">Se connecter</button><div id="loginError" class="auth-error" hidden></div></form>
<p class="auth-help">Aucun dossier patient réel ne doit être déposé tant que le stockage santé dédié n’est pas activé.</p><a class="auth-back" href="/">← Retour au site M FactU</a></section></main>
<script>
const form=document.getElementById('loginForm'), err=document.getElementById('loginError'), btn=document.getElementById('loginBtn');
form.addEventListener('submit',async(e)=>{e.preventDefault();err.hidden=true;btn.disabled=true;btn.textContent='Connexion…';const fd=new FormData(form);const next=new URLSearchParams(location.search).get('next')||'';try{const r=await fetch('/api/auth-login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:fd.get('email'),password:fd.get('password'),next})});const data=await r.json();if(!r.ok)throw new Error(data.error||'LOGIN_FAILED');location.href=data.redirect||'/admin';}catch(ex){const labels={INVALID_CREDENTIALS:'Email ou mot de passe incorrect.',DATABASE_UNAVAILABLE:'La base client est momentanément indisponible.',EMAIL_PASSWORD_REQUIRED:'Renseignez votre email et votre mot de passe.'};err.textContent=labels[ex.message]||'Connexion impossible. Vérifiez la configuration M FactU.';err.hidden=false;}finally{btn.disabled=false;btn.textContent='Se connecter';}});
</script></body></html>
